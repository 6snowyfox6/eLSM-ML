paper: Schaefer & Wagner, PRD 79, 014018 (2009), arXiv:0808.1491
basis_note: '2+1 quark-meson model, mesonic part = U(3)xU(3) LSM, no vector mesons (Z_i=1). sigma_x=f_pi=92.4, sigma_y=(2f_K-f_pi)/sqrt2=94.47 (paper: 94.5). h_x,h_y printed directly (nonstrange-strange
  basis). Table I prints m_pi=138, m_K=496 as fit inputs. At c=0 the paper labels the lower pseudoscalar eigenvalue (138.0, = m_pi) as eta'' and the upper (634.8) as eta; here compared as lower/upper eigenvalue.
  Finite-T part is QM without Polyakov loop -> not runnable (feature).'
z_factors: none
