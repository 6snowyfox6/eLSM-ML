paper: "Tripathi, Rai, Tiwari, arXiv:2512.13398 (2025), Table II (QM parameters) and Table III (s-MFA rows QM, Log PQM; m_sigma = 500)"
note: "Standard mean field (no-sea) QM and Log PQM rows only; RQM/RPQM (on-shell renormalized vacuum term), PolyLog-glue and vector interactions = features. Log potential RRW (as solver), T0 = 187 MeV (paper Sec. II B). Paper: Phi, Phibar independent reals at the saddle point of the real part (Sec. II B). Independent-real MINIMIZATION is ill-posed (runs to the Phibar=0.999 bound even at mu=0, see result.md), so Phi=Phibar (PQM_equal) is used: exact at mu=0; at mu>0 differs from the saddle-point method by a few MeV in mu_CEP (cf. Mintz 2013 Table III). Physical point g = 6.5 (Rai 2023). Chiral-limit rows (m_pi = 0, f_pi = 90.67): g not stated -> run with g = 6.5 and with g = 2*300.3/90.67 = 6.624."
